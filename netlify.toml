# Netlify deploy config.
# Since the vite-react-ssg migration the build emits one HTML file per route
# (build/about.html, build/projects/<slug>.html, …), so deep links resolve to
# real files — the old SPA catch-all (`/* → /index.html 200`) is GONE. It
# would have been harmless for existing pages (Netlify prefers real files)
# but it masked genuinely missing paths as 200-HTML (fonts bug, the missing
# 1.avif images). Unmatched paths now get build/404.html with a real 404.

[build]
  command = "npm run build"  # = vite-react-ssg build (package.json)
  publish = "build"          # matches vite.config.js `build.outDir`

# Hidden agency-wholesale page lives at /partners — a normal pre-rendered
# route (build/partners.html) that ships ONLY the password lock screen. The
# offer chunk (PartnersPage) lazy-loads client-side after the SHA-256 password
# check in PartnersGate.js, so no rewrite/catch-all is needed here (the global
# SPA catch-all stays removed on purpose so real 404s elsewhere are preserved).
# The noindex header for /partners is below.

[build.environment]
  NODE_VERSION = "22"        # Vite 7 requires node ^20.19.0 || >=22.12.0; pin to 22

# Analytics is PRODUCTION-ONLY. Netlify injects the site-level
# VITE_GA_MEASUREMENT_ID into every build context, so deploy previews and branch
# deploys were shipping a live tag on *.netlify.app — their traffic landed in the
# real property, and GA4's tag diagnostics flagged the preview host twice
# ("some pages not tagged", "additional domains detected", 2026-08-03). Blanking
# the ID per context makes `analyticsEnabled` false there (ga.js gates on
# Boolean(GA_MEASUREMENT_ID)), so previews collect nothing. Do NOT "fix" the
# diagnostics by adding *.netlify.app as a configured domain — that would merge
# preview sessions into production cross-domain measurement.
[context.deploy-preview.environment]
  VITE_GA_MEASUREMENT_ID = ""
  VITE_META_PIXEL_ID = ""

[context.branch-deploy.environment]
  VITE_GA_MEASUREMENT_ID = ""
  VITE_META_PIXEL_ID = ""

# Security response headers, applied to every route.
# All headers here are ENFORCED. The CSP blocks violating resources (not just
# reports them). It first ran as Content-Security-Policy-Report-Only against live
# prod traffic and was confirmed clean (zero violations across all flows), then
# promoted to this enforcing header. ROLLBACK: rename the key back to
# Content-Security-Policy-Report-Only to instantly revert to non-blocking
# (reports only, same policy string) — no other change needed.
# Allowlist derived from runtime recon: gtag.js (googletagmanager) + GA4 collect
# endpoints, self-hosted fonts/images/video/HDRI,
# NOTE (2026-08-03): the original recon MISSED the apex host analytics.google.com
# — `https://*.analytics.google.com` does NOT match it (a wildcard covers
# subdomains only). Once consent is GRANTED and the property is Ads-linked, gtag
# transports every hit to https://analytics.google.com/g/collect, so all of it was
# CSP-blocked and GA4 showed "No data received" for months. Keep the apex host AND
# the wildcard; stats.g.doubleclick.net covers the Ads-linked/Signals pings.
# beasties + TextPressure inline <style> ('unsafe-inline'), and the Moon's
# Meshopt decoder (WASM in a blob: worker → 'wasm-unsafe-eval' + worker-src blob:,
# plus connect-src blob: for the decoder's blob: fetch).
# script-src 'unsafe-inline': vite-react-ssg injects two inline bootstrap scripts
# (__staticRouterHydrationData, __VITE_REACT_SSG_HASH__) whose content varies per
# build/route — sha256 hashes break every build and static Netlify can't mint
# nonces, so 'unsafe-inline' is the only viable allowance for these.
# Meta Pixel (2026-08-29, load-on-consent — see src/analytics/metaPixel.js):
# connect.facebook.net serves fbevents.js (script-src) and its config fetch
# (connect-src); www.facebook.com receives the /tr hits, which travel as fetch/
# beacon OR image pixel depending on context — so it's in BOTH connect-src and
# img-src (the GA4 lesson: allowlist every transport variant, and remember a
# "clean" pre-consent run proves nothing — the pixel only fires POST-consent,
# so exercise Accept + a conversion when verifying this policy).
# Google Ads (2026-10-07): the GA4 property is Ads-linked, and on /contact gtag
# sends an Ads conversion ping to pagead2.googlesyndication.com, which this
# policy blocked (seen on the live site in the React 19 deploy check; it predates
# that upgrade). Added Google's documented Google Ads host set
# (developers.google.com/tag-platform/security/guides/csp): googleadservices,
# www.google.com (script-src); googleadservices, googleads.g.doubleclick.net,
# pagead2.googlesyndication.com, www.google.com (img-src and connect-src, plus
# ad.doubleclick.net in connect-src); www.googletagmanager.com in frame-src (the
# tag's service-worker iframe, listed for GA4 and Ads alike). Deploy previews run
# without the GA ID, so this can only be verified on production: Accept, then
# load /contact, and expect zero securitypolicyviolation events.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://connect.facebook.net https://www.googleadservices.com https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.facebook.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com; font-src 'self'; connect-src 'self' blob: https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://ad.doubleclick.net; media-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com https://www.googletagmanager.com; frame-ancestors 'none'"

# Vite writes every bundled asset under /assets/ with a content hash in its
# name (app-CJ9aAbaV.js, the CSS, imported images), so a URL there never
# changes meaning: cache it for a year. Everything else keeps Netlify's default
# (max-age=0, must-revalidate), which is right for the HTML and for public/,
# whose file names are hand-written and keep their name when the bytes change.
# Found by the 2026-10-09 SEO audit: every repeat visit re-validated every
# bundle. Verify after deploy: `curl -sI https://switchcasestudio.com/assets/<app
# chunk>` must say max-age=31536000, immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /partners ships a real (crawlable) static file, so enforce noindex at the
# HTTP layer — authoritative for crawlers regardless of the HTML or whether JS
# runs. Belt-and-suspenders on top of the page's own <Seo robots="noindex,
# nofollow">. (The offer content itself only loads client-side after the
# password check, so crawlers see only the lock screen anyway.)
[[headers]]
  for = "/partners"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Unhurried Pro (2026-09-25). The sales page is static (public/unhurried-pro/).
# The thank-you page is reached only from Stripe's post-payment redirect, so keep
# it out of search; the download itself is a Netlify function
# (netlify/functions/unhurried-pro-download.mjs) that verifies the Stripe session.
[[headers]]
  for = "/unhurried-pro/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /agents was removed 2026-09-02 (owner decision, refresh branch). It had been
# live, indexed and in the sitemap, so a hard 404 would strand inbound links
# and crawlers — 301 to the home page instead. Remove this block only if the
# route ever comes back.
[[redirects]]
  from = "/agents"
  to = "/"
  status = 301

# Services consolidated 7 → 4 on 2026-09-10 (owner decision). The three
# retired pricing pages were live and in the sitemap: 301 each to the
# service that absorbed it. Remove a block only if that slug comes back.
# /services duplicated /pricing and was retired 2026-09-10; /pricing is now
# "Services & Pricing". The old page was live and in the sitemap.
[[redirects]]
  from = "/services"
  to = "/pricing"
  status = 301

[[redirects]]
  from = "/pricing/automation-integrations"
  to = "/pricing/ai-development"
  status = 301

[[redirects]]
  from = "/pricing/email-marketing"
  to = "/pricing/marketing-ads"
  status = 301

[[redirects]]
  from = "/pricing/hosting-maintenance"
  to = "/pricing/web-development"
  status = 301
