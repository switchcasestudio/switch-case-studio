<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & Android/Apple Device Icons -->
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Switch Case Studio" />
    <!--
      Route-variable head tags (title, description, canonical, og:*, twitter:*)
      are managed per-route by src/components/util/Seo.js and BAKED INTO each
      page's static HTML by vite-react-ssg at build time, injected right after
      <head>. Any static copy here would duplicate them in every built file
      (two titles / two og:titles = scrapers and Google pick at random). The
      old "fallback for non-JS scrapers" block is obsolete: with SSG, scrapers
      get the real per-route tags without running JS. Only true site-wide
      constants live below (favicons, og:site_name/locale, Org/WebSite JSON-LD,
      fonts, manifest).
    -->
    <meta property="og:site_name" content="Switch Case Studio" />
    <meta property="og:locale" content="en_US" />
    <!-- Meta (Facebook) domain verification for the "Switch Case Studio"
         business portfolio; pairs with the Meta Pixel (CLAUDE.md). Site-wide
         constant by design: Meta reads it on the home page; SSG baking it into
         every route is harmless. Do not remove: unverifies the domain. -->
    <meta name="facebook-domain-verification" content="ftno17feqd2ufyjw7ouizfi9lfk7zc" />

    <!--
      Structured data: Organization + WebSite (site-wide).

      The Organization `sameAs` array MIRRORS src/data/social.js, which is the
      single source of truth and also feeds the footer icon row. JSON-LD allows
      no comments and this file cannot import a module, so this is a necessary
      hand-mirror: add or change a profile in social.js FIRST, then update the
      array below in the same commit. `npm run check:sameas` fails the build if
      the two ever drift apart.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://switchcasestudio.com/#org",
            "name": "Switch Case Studio",
            "legalName": "Switch Case LLC",
            "url": "https://switchcasestudio.com",
            "logo": "https://switchcasestudio.com/images/og/og.png",
            "description": "AI-first design and engineering studio building conversion-focused websites, e-commerce stores, web apps, AI assistants, and business automation from scratch.",
            "knowsAbout": [
              "Web design",
              "Web development",
              "E-commerce",
              "AI development",
              "AI chatbots and agents",
              "Workflow automation",
              "n8n",
              "Zapier",
              "GoHighLevel",
              "VPS hosting and self-hosted infrastructure",
              "SEO and AI-search optimization (GEO)"
            ],
            "email": "hello@switchcasestudio.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Portland",
              "addressRegion": "OR",
              "addressCountry": "US"
            },
            "sameAs": [
              "https://github.com/switchcasestudio",
              "https://www.instagram.com/switchcasestudio",
              "https://www.threads.com/@switchcasestudio",
              "https://x.com/s_c_studio",
              "https://www.facebook.com/profile.php?id=61592118681299",
              "https://www.linkedin.com/company/127224064",
              "https://maps.google.com/?cid=875109400879972028"
            ],
            "founder": {
              "@type": "Person",
              "@id": "https://switchcasestudio.com/#moses-atia-poston",
              "name": "Moses Atia Poston",
              "jobTitle": "Founder",
              "url": "https://switchcasestudio.com/about",
              "sameAs": [
                "https://www.linkedin.com/in/moses-a-p/",
                "https://github.com/switchcasestudio"
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://switchcasestudio.com/#website",
            "name": "Switch Case Studio",
            "alternateName": "SCS",
            "url": "https://switchcasestudio.com",
            "publisher": { "@id": "https://switchcasestudio.com/#org" }
          }
        ]
      }
    </script>

    <!-- Fonts are self-hosted (public/fonts/, latin woff2 only); @font-face
         lives in app.scss. No Google Fonts: the css2 link shipped 31+
         cross-origin files. Preload ONLY the hero face (SCS Display, the LCP
         element); Inter weights load on demand via the CSS. -->
    <link
      rel="preload"
      href="/fonts/SCS-Display-v3.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Web Manifest Link (Pointing to your custom favicon folder) -->
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <!-- No static <title>: every route's title is injected at build time by
         vite-react-ssg from <Seo>; a static one would ship two titles. -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
