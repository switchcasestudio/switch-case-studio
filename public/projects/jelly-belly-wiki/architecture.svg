<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 462" width="1200" height="462" role="img" aria-label="Jelly Belly Wiki architecture: source site, Python scraper, MySQL database, C# ASP.NET Core API, React client, plus any third-party developer consuming the same public endpoints.">
  <defs>
    <style>
      .n-box   { fill: #ffffff; fill-opacity: .03; stroke: #ffffff; stroke-opacity: .18; }
      .n-num   { fill: #d99cff; font-size: 13px; font-weight: 700; letter-spacing: .14em; }
      .n-title { fill: #fef7ed; font-size: 22px; font-weight: 700; }
      .n-body  { fill: #fef7ed; fill-opacity: .74; font-size: 14px; }
      .n-host  { fill: #ff834a; font-size: 13px; font-weight: 600; }
      .flow    { stroke: #d99cff; stroke-opacity: .85; stroke-width: 2; fill: none; }
      .flow-d  { stroke: #d99cff; stroke-opacity: .45; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
      .cap     { fill: #fef7ed; fill-opacity: .55; font-size: 14px; }
      text     { font-family: Inter, Helvetica, Arial, sans-serif; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d99cff" fill-opacity=".85"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d99cff" fill-opacity=".45"/>
    </marker>
  </defs>

  <!-- 01 Source -->
  <rect class="n-box" x="28" y="60" width="205" height="180" rx="14"/>
  <text class="n-num"   x="50" y="94">01 · SOURCE</text>
  <text class="n-title" x="50" y="128">Jelly Belly</text>
  <text class="n-body"  x="50" y="158">Official product site</text>
  <text class="n-body"  x="50" y="180">Flavors, recipes,</text>
  <text class="n-body"  x="50" y="202">facts, milestones</text>

  <!-- 02 Scrape -->
  <rect class="n-box" x="263" y="60" width="205" height="180" rx="14"/>
  <text class="n-num"   x="285" y="94">02 · COLLECT</text>
  <text class="n-title" x="285" y="128">Python</text>
  <text class="n-body"  x="285" y="158">Selenium WebDriver</text>
  <text class="n-body"  x="285" y="180">BeautifulSoup</text>
  <text class="n-body"  x="285" y="202">Normalized JSON</text>

  <!-- 03 Store -->
  <rect class="n-box" x="498" y="60" width="205" height="180" rx="14"/>
  <text class="n-num"   x="520" y="94">03 · STORE</text>
  <text class="n-title" x="520" y="128">MySQL</text>
  <text class="n-body"  x="520" y="158">EF Core migrations</text>
  <text class="n-body"  x="520" y="180">5 related resources</text>
  <text class="n-host"  x="520" y="212">hosted on TiDB</text>

  <!-- 04 Serve -->
  <rect class="n-box" x="733" y="60" width="205" height="180" rx="14"/>
  <text class="n-num"   x="755" y="94">04 · SERVE</text>
  <text class="n-title" x="755" y="128">C# / .NET API</text>
  <text class="n-body"  x="755" y="158">ASP.NET Core · LINQ</text>
  <text class="n-body"  x="755" y="180">10 endpoints, paged</text>
  <text class="n-host"  x="755" y="212">hosted on Render</text>

  <!-- 05 Consume -->
  <rect class="n-box" x="968" y="60" width="205" height="180" rx="14"/>
  <text class="n-num"   x="990" y="94">05 · CONSUME</text>
  <text class="n-title" x="990" y="128">React client</text>
  <text class="n-body"  x="990" y="158">Jest-tested</text>
  <text class="n-body"  x="990" y="180">Built only from the</text>
  <text class="n-body"  x="990" y="202">public endpoints</text>
  <text class="n-host"  x="990" y="228">hosted on Netlify</text>

  <!-- flow arrows between stages -->
  <path class="flow" d="M237 150 H255" marker-end="url(#a)"/>
  <path class="flow" d="M472 150 H490" marker-end="url(#a)"/>
  <path class="flow" d="M707 150 H725" marker-end="url(#a)"/>
  <path class="flow" d="M942 150 H960" marker-end="url(#a)"/>

  <!-- Swagger docs, hanging off the API -->
  <rect class="n-box" x="733" y="330" width="205" height="96" rx="14"/>
  <text class="n-title" x="755" y="366" style="font-size:18px">Swagger UI</text>
  <text class="n-body"  x="755" y="392">Interactive public docs</text>
  <text class="n-body"  x="755" y="412">Try an endpoint first</text>
  <path class="flow" d="M835 240 V322" marker-end="url(#a)"/>

  <!-- any third-party developer -->
  <rect class="n-box" x="968" y="330" width="205" height="96" rx="14"/>
  <text class="n-title" x="990" y="366" style="font-size:18px">Any developer</text>
  <text class="n-body"  x="990" y="392">Same endpoints, no</text>
  <text class="n-body"  x="990" y="412">special access</text>
  <path class="flow-d" d="M938 378 H960" marker-end="url(#ad)"/>

  <text class="cap" x="28" y="372">Three languages. Three separately deployed services. One developer.</text>
  <text class="cap" x="28" y="398">The React client is just the first consumer of a public API —</text>
  <text class="cap" x="28" y="422">not a private back end.</text>
</svg>
